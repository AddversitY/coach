# Refits the Coach's Line from free nflverse files and checks the app.
# The trainer does not call The Odds API and does not use a key.
name: Coach's Line

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Tuesday 14:00 UTC, after the Monday game, during the season and out of it.
    - cron: "0 14 * * 2"

permissions:
  contents: write

concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model:
    name: Train and backtest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model packages
        run: pip install -r model/requirements.txt

      - name: Test the rating math and the walk-forward split
        run: python -m unittest discover -s model -t model

      - name: Train from a clean checkout
        run: python model/train.py

      - name: Validate the prior-season parlay dependence model
        run: python model/parlay_simulation.py

      - name: Train the fixed game-score candidate
        run: python model/game_forecast.py --schedule model/.cache/games.csv

      - name: Evaluate the shadow challenger on separate seasons
        run: python model/forecast_lab.py --schedule model/.cache/games.csv

      - name: Audit game errors and freeze the scoring-regime challenger
        run: |
          python model/error_audit.py --schedule model/.cache/games.csv
          python model/regime_forecast.py --schedule model/.cache/games.csv

      - name: Build sourced pregame football features and evaluate one fixed challenger
        run: |
          python model/football_features.py
          python model/football_forecast.py --schedule model/.cache/games.csv

      - name: Evaluate conditional workload forecasts
        run: python model/workload_forecast.py --schedule model/.cache/games.csv

      - name: Evaluate joint workload and efficiency production forecasts
        run: python model/production_forecast.py --schedule model/.cache/games.csv

      - name: Set up Flutter to check the regenerated reports
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Validate the app against the newly generated reports
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web

      - name: Preserve completed public research reports
        uses: actions/upload-artifact@v4
        with:
          name: coach-research-${{ github.run_id }}
          retention-days: 7
          path: |
            assets/nfl-model.json
            assets/parlay-calibration.json
            assets/game-forecast-model.json
            assets/forecast-lab.json
            assets/game-error-audit.json
            assets/regime-research.json
            assets/team-efficiency.json
            assets/football-research.json
            assets/workload-model.json
            assets/production-model.json

      - name: Commit a refreshed model report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "odds-edge-model"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nfl-model.json assets/parlay-calibration.json assets/game-forecast-model.json assets/forecast-lab.json assets/game-error-audit.json assets/regime-research.json assets/team-efficiency.json assets/football-research.json assets/workload-model.json assets/production-model.json
          if git diff --cached --quiet; then
            echo "Model reports unchanged."
          else
            git commit -m "Refresh Coach's Line from nflverse"
            git fetch origin main
            # Code may move during a long fit. Rebase those changes, but never
            # publish a model trained against a different evidence batch.
            if ! git diff --quiet HEAD origin/main -- assets/nfl-history.json assets/nfl-player-stats.json assets/nfl-matchup.json; then
              echo "Evidence changed during fitting. Reports are saved as an artifact; a fresh fit is required."
              exit 1
            fi
            git rebase origin/main
            git push
          fi

  app:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install Dart packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web
