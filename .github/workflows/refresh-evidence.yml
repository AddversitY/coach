name: Refresh research evidence

on:
  workflow_dispatch:
  schedule:
    # After the overnight source updates, before the morning Pages publication.
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install evidence and validation packages
        run: pip install -r model/requirements.txt
      - name: Check exporters and preservation on failure
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Stage and refresh research evidence together
        run: python tools/refresh_research.py
      - name: Check model and dependence math
        run: python -m unittest discover -s model -t model
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check the refreshed app builds
        run: flutter build web --release --base-href /odds-edge/ --dart-define=ODDS_SNAPSHOT_PATH=data/snapshot.json
      - name: Save only validated research assets
        run: |
          git config user.name "odds-edge-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nfl-player-stats.json assets/nfl-history.json assets/nfl-matchup.json assets/parlay-calibration.json
          if git diff --cached --quiet; then
            echo "Research evidence unchanged."
          else
            git commit -m "Refresh dated NFL research evidence"
            git push origin HEAD:main
          fi
