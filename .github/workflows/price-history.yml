name: Price history

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. The script scrapes only when a game is at
    # T-24h, T-6h, T-3h, T-90m, T-30m, or about 10 minutes before kickoff.
    # Odds API credits are spent only inside the cap in tools/line_timing.py.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            backend/data/book-props.json
            backend/data/games.csv
          key: book-props-${{ github.run_id }}
          restore-keys: |
            book-props-
      - name: Save published prices and try public sportsbook pages
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          BOOK_PROPS_INGEST_URL: ${{ vars.COACH_API_BASE_URL }}
          BOOK_PROPS_INGEST_SECRET: ${{ secrets.BOOK_PROPS_INGEST_SECRET }}
        run: |
          python tools/price_history.py \
            --history assets/price-history.json \
            --grade-output assets/self-grade.json \
            --moves-output assets/line-moves.json \
            --snapshot-url https://addversity.github.io/coach/data/snapshot.json \
            --dense \
            --grade
      - name: Score settled chances against saved closes
        run: |
          python tools/accuracy_scorecard.py \
            --history assets/price-history.json \
            --history-results assets/nfl-history.json \
            --model assets/nfl-model.json \
            --props assets/prop-closes.json \
            --prop-chances assets/prop-served-chances.json \
            --output assets/accuracy-scorecard.json
      - name: Commit saved prices and the scorecard
        run: |
          git config user.name "odds-edge-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/price-history.json assets/self-grade.json assets/line-moves.json assets/book-price-coverage.json assets/accuracy-scorecard.json
          if git diff --cached --quiet; then
            echo "Price history unchanged."
          else
            git commit -m "Save public price snapshots, closing lines, and the accuracy scorecard"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
