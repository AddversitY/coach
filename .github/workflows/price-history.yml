name: Price history

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. The script scrapes only when a game is at
    # T-24h, T-6h, T-3h, T-90m, T-30m, or about 10 minutes before kickoff.
    # Odds API credits are spent only inside the cap in tools/line_timing.py.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save published prices and try public sportsbook pages
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python tools/price_history.py \
            --history assets/price-history.json \
            --grade-output assets/self-grade.json \
            --moves-output assets/line-moves.json \
            --snapshot-url https://addversity.github.io/coach/data/snapshot.json \
            --dense \
            --grade
      - name: Commit new prices only
        run: |
          git config user.name "odds-edge-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/price-history.json assets/self-grade.json assets/line-moves.json
          if git diff --cached --quiet; then
            echo "Price history unchanged."
          else
            git commit -m "Save public price snapshots and closing lines"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
